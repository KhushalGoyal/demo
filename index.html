<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#4a0e1f" />
  <title>Khushal weds Mitali · Choose your invitation</title>
  <meta name="description" content="Together with their families, Khushal & Mitali (Navya) joyfully invite you to celebrate their wedding. Open the groom's or the bride's invitation." />

  <!-- Social preview -->
  <meta property="og:title" content="Khushal weds Mitali — You're Invited" />
  <meta property="og:description" content="A premium digital wedding invitation. Open the groom's or the bride's side." />
  <meta property="og:type" content="website" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Great+Vibes&family=Marcellus&family=Tangerine:wght@400;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

  <!-- Legacy + query handling: old ?bride=1 / ?side= links jump straight to
       the right sub-page, and any remaining query (e.g. ?rsvp=1) is carried
       onto whichever invitation the visitor opens. -->
  <script>
    (function () {
      try {
        var p = new URLSearchParams(window.location.search);
        var b = p.get("bride");
        var side = (p.get("side") || "").toLowerCase();
        var go =
          (side === "bride" || (b !== null && !/^(0|false|no|off)$/i.test(b.trim()))) ? "bride" :
          (side === "groom" || b !== null) ? "groom" : "";
        p.delete("side"); p.delete("bride");
        var rest = p.toString();
        var suffix = rest ? ("?" + rest) : "";
        if (go) {
          window.location.replace((go === "bride" ? "MitaliWedsKhushal/" : "KhushalWedsMitali/") + suffix);
          return;
        }
        if (suffix) {
          document.addEventListener("DOMContentLoaded", function () {
            var links = document.querySelectorAll("a.choice");
            for (var i = 0; i < links.length; i++) {
              links[i].setAttribute("href", links[i].getAttribute("href") + suffix);
            }
          });
        }
      } catch (e) { /* query unparsable — plain links still work */ }
    })();
  </script>

  <style>
    /* ---- Landing / side chooser (self-contained; rides style.css tokens) ---- */
    .chooser-page {
      min-height: 100vh;
      display: grid;
      place-content: center;
      text-align: center;
      padding: 2.2rem 1.25rem;
      color: var(--ivory);
      background: radial-gradient(ellipse at 50% 0%, var(--maroon-700), var(--maroon-900) 72%);
    }
    .chooser-page::before {
      content: "";
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(circle at 20% 25%, rgba(241,165,58,0.12), transparent 40%),
        radial-gradient(circle at 80% 75%, rgba(212,175,55,0.12), transparent 42%);
    }
    .chooser { position: relative; z-index: 1; max-width: 880px; margin: 0 auto; }
    .chooser__mono {
      display: inline-block;
      font-family: var(--font-script);
      font-size: 3rem; line-height: 1;
      color: var(--gold-300);
      margin-bottom: 1rem;
    }
    .chooser__mono span { font-size: 1.9rem; opacity: 0.8; }
    .chooser__pre {
      font-family: var(--font-sans);
      letter-spacing: 0.3em; text-transform: uppercase;
      font-size: 0.66rem; color: var(--gold-200); margin-bottom: 0.5rem;
    }
    .chooser__names {
      font-family: var(--font-script); font-weight: 400;
      font-size: clamp(2.4rem, 9vw, 4rem); line-height: 1.05;
      color: var(--ivory); text-shadow: 0 6px 26px rgba(0,0,0,0.45);
    }
    .chooser__names em { font-style: normal; color: var(--gold-300); font-size: 0.68em; }
    .chooser__sub {
      font-style: italic; color: var(--cream); opacity: 0.9;
      margin: 0.6rem auto 2.4rem; max-width: 36ch;
    }

    .chooser__cards {
      display: grid; gap: 1.3rem;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .choice {
      position: relative;
      display: flex; flex-direction: column; align-items: center; gap: 0.35rem;
      padding: 2.1rem 1.5rem 1.8rem;
      border-radius: 18px;
      border: 1px solid rgba(212,175,55,0.45);
      background: linear-gradient(160deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
      box-shadow: 0 18px 46px -22px rgba(0,0,0,0.75);
      transition: transform 0.35s var(--ease), box-shadow 0.35s var(--ease), border-color 0.35s;
      overflow: hidden;
    }
    .choice::after {
      content: ""; position: absolute; inset: 0;
      background: radial-gradient(circle at 50% 0%, rgba(212,175,55,0.14), transparent 60%);
      opacity: 0; transition: opacity 0.35s;
    }
    .choice:hover, .choice:focus-visible {
      transform: translateY(-5px);
      border-color: var(--gold-300);
      box-shadow: 0 26px 60px -24px rgba(0,0,0,0.85);
      outline: none;
    }
    .choice:hover::after, .choice:focus-visible::after { opacity: 1; }
    .choice__mono {
      font-family: var(--font-script); font-size: 2.4rem; line-height: 1;
      color: var(--gold-300);
    }
    .choice__mono span { font-size: 1.5rem; opacity: 0.8; }
    .choice__title {
      font-family: var(--font-sans);
      letter-spacing: 0.14em; text-transform: uppercase;
      font-size: 0.82rem; color: var(--ivory); margin-top: 0.4rem;
    }
    .choice__name {
      font-family: var(--font-serif); font-size: 0.95rem;
      color: var(--cream); opacity: 0.82;
    }
    .choice__cta {
      margin-top: 0.9rem;
      font-family: var(--font-sans); font-size: 0.72rem;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--maroon-900);
      background: linear-gradient(135deg, var(--gold-400), var(--gold-300));
      padding: 0.55rem 1.4rem; border-radius: 30px;
    }

    /* Bride card: coordinated "rani pink" so the two clearly share a wedding */
    .choice--bride {
      border-color: rgba(207,159,107,0.5);
      background: linear-gradient(160deg, rgba(224,106,156,0.16), rgba(130,32,86,0.14));
    }
    .choice--bride .choice__mono { color: #e7c38f; }
    .choice--bride:hover, .choice--bride:focus-visible { border-color: #e7c38f; }
    .choice--bride:hover::after, .choice--bride:focus-visible::after { opacity: 1; }
    .choice--bride .choice__cta {
      color: #3d0a2b;
      background: linear-gradient(135deg, #cf9f6b, #e7c38f);
    }

    .chooser__note {
      margin-top: 2rem;
      font-family: var(--font-sans); font-size: 0.62rem;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--gold-200); opacity: 0.72;
    }

    @media (max-width: 640px) {
      .chooser__cards { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      .choice { transition: none; }
    }
  </style>
</head>
<body class="chooser-page">

  <main class="chooser">
    <span class="chooser__mono">K<span>&amp;</span>M</span>
    <p class="chooser__pre">Together with our families</p>
    <h1 class="chooser__names">Khushal <em>&amp;</em> Mitali</h1>
    <p class="chooser__sub">Whose side are you joining us from? Choose an invitation to open.</p>

    <div class="chooser__cards">
      <a class="choice choice--groom" href="KhushalWedsMitali/" aria-label="Open the groom's invitation — Khushal's side">
        <span class="choice__mono">K<span>&amp;</span>M</span>
        <span class="choice__title">Groom's Invitation</span>
        <span class="choice__name">Khushal's side · Goyal family</span>
        <span class="choice__cta">Open →</span>
      </a>

      <a class="choice choice--bride" href="MitaliWedsKhushal/" aria-label="Open the bride's invitation — Mitali's side">
        <span class="choice__mono">M<span>&amp;</span>K</span>
        <span class="choice__title">Bride's Invitation</span>
        <span class="choice__name">Mitali's side · Gupta family</span>
        <span class="choice__cta">Open →</span>
      </a>
    </div>

    <p class="chooser__note">♪ Each invitation opens with music &amp; a short intro</p>
  </main>

</body>
</html>
